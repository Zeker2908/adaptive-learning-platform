server:
  port: 8084

spring:
  application:
    name: solution-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost:5432}/learning?currentSchema=solution_service
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME:admin}
    password: ${POSTGRES_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: solution_service
        format_sql: true
    database: postgresql
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: solution_service
    liquibase-schema: public
    database-change-log-table: solution_service_databasechangelog
    database-change-log-lock-table: solution_service_databasechangeloglock
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}
    properties:
      retries: 10
      retry.backoff.ms: 2000
    admin:
      properties:
        offsets.topic.replication-factor: 1
        transactions.state.log.replication-factor: 1
        transactions.state.log.min.isr: 1

task:
  service:
    url: http://task-service:8082

logging:
  level:
    root: INFO
    ru.zeker: DEBUG

app:
  domain: http://localhost:8080
  version: 1

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

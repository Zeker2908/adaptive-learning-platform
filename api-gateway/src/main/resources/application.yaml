spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      # === CORS для фронта ===
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "https://adaptiver.ru"
                  - "https://www.adaptiver.ru"
                  - "http://localhost:*"
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers:
                  - Authorization
                  - Set-Cookie
                allow-credentials: true
                max-age: 3600
          routes:
            # === SOLUTION SERVICE ===
            - id: solution-service
              uri: http://solution-service:8084
              predicates:
                - Path=/api/v${app.version}/solutions/**
              filters:
                - StripPrefix=2

            - id: solution-service
              uri: http://solution-service:8084
              predicates:
                - Path=/api/v${app.version}/recommendations/**
              filters:
                - StripPrefix=2

            - id: solution-service-admin
              uri: http://solution-service:8084
              predicates:
                - Path=/api/v${app.version}/admin/solutions/**
              filters:
                - StripPrefix=2
              metadata:
                required-role: ADMIN

            # === TASK SERVICE ===
            - id: task-service-admin
              uri: http://task-service:8082
              predicates:
                - Path=/api/v${app.version}/admin/tasks/**
              filters:
                - StripPrefix=2
              metadata:
                required-role: ADMIN

            - id: task-service
              uri: http://task-service:8082
              predicates:
                - Path=/api/v${app.version}/tasks/**
              filters:
                - StripPrefix=2

            # === AUTH SERVICE ===
            - id: authentication-service-auth
              uri: http://authentication-service:8081
              predicates:
                - Path=/api/v${app.version}/auth/**
              filters:
                - StripPrefix=2
              metadata:
                auth-required: false

            - id: authentication-service-users
              uri: http://authentication-service:8081
              predicates:
                - Path=/api/v${app.version}/users/**
              filters:
                - StripPrefix=2

            # === ADMIN ===
            - id: authentication-service-admin
              uri: http://authentication-service:8081
              predicates:
                - Path=/api/v${app.version}/admin/**
              filters:
                - StripPrefix=2
              metadata:
                required-role: ADMIN


            # === OAUTH2 FLOW ===
            - id: oauth2-authorization
              uri: http://authentication-service:8081
              predicates:
                - Path=/oauth2/authorization/**
              filters:
                - RewritePath=/oauth2/authorization/(?<seg>.*), /oauth2/authorization/${seg}
              metadata:
                auth-required: false

            - id: oauth2-callback
              uri: http://authentication-service:8081
              predicates:
                - Path=/login/oauth2/code/**
              filters:
                - RewritePath=/login/oauth2/code/(?<seg>.*), /login/oauth2/code/${seg}
              metadata:
                auth-required: false

            # === Swagger passthrough ===
            - id: authentication-service-docs
              uri: http://authentication-service:8081
              predicates:
                - Path=/authentication-service/v3/api-docs/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false
              order: -1

            - id: solution-service-docs
              uri: http://solution-service:8084
              predicates:
                - Path=/solution-service/v3/api-docs/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false
              order: -1

            - id: task-service-docs
              uri: http://task-service:8082
              predicates:
                - Path=/task-service/v3/api-docs/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false
              order: -1

            - id: authentication-service-docs-swagger
              uri: http://authentication-service:8081
              predicates:
                - Path=/authentication-service/swagger-ui.html
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false
              order: -1

            - id: task-service-docs-swagger
              uri: http://task-service:8082
              predicates:
                - Path=/task-service/swagger-ui.html
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false
              order: -1

            - id: solution-service-docs-swagger
              uri: http://solution-service:8084
              predicates:
                - Path=/solution-service/swagger-ui.html
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false
              order: -1

server:
  port: 8080
  forward-headers-strategy: framework

jwt:
  public-key-path: ${PUBLIC_KEY}
  access:
    expiration: ${ACCESS_TOKEN_DURATION}
  refresh:
    expiration: ${REFRESH_TOKEN_DURATION}

logging:
  level:
    root: DEBUG
    org.springframework.security: INFO
    ru.zeker: DEBUG

app:
  version: 1

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: authentication-service
        url: /authentication-service/v3/api-docs
      - name: task-service
        url: /task-service/v3/api-docs
      - name: solution-service
        url: /solution-service/v3/api-docs